[pytest]
# Only test_*.py, NOT the *_test.py half of pytest's default. The two
# *_test.py scripts under tools/ (germany_test.py, matrix_test.py) are
# one-off analyses, not tests, and pytest's default discovery would try
# to collect them.
python_files = test_*.py
testpaths = tests

# The pipeline package lives in core/ and the desktop app in gui/; tests
# import both flat (import config / import tasks), so both must be on
# sys.path during collection.
pythonpath = core gui

# Keep output short enough to read in CI logs.
addopts = -q --tb=short
