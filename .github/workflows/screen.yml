name: Screen and publish

on:
  schedule:
    - cron: '0 6 1 1,4,7,10 *'   # 06:00 UTC, 1st of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LibreOffice (headless recalculation engine)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Attach the persisted-state branch as a worktree
        # actions/cache evicts anything unused for 7 days; this runs
        # quarterly, so state lives on a `data` branch instead.
        # First-run bootstrap if git < 2.42 lacks `worktree add --orphan`:
        #   git checkout --orphan data && git rm -rf . && \
        #   git commit --allow-empty -m init && git push origin data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add data-branch origin/data
          else
            git worktree add --orphan -b data data-branch
          fi

      - name: Restore state from the last run
        run: |
          for f in financials.db portfolio.db parameters.json refdata_tables.json shares.csv; do
            if [ -f "data-branch/$f" ]; then
              cp "data-branch/$f" "$f"
              echo "restored $f"
            else
              echo "no prior $f -- first run"
            fi
          done

      - name: Run the pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENFIGI_API_KEY: ${{ secrets.OPENFIGI_API_KEY }}
        run: python scripts/ci_screen.py

      - name: Persist state for the next run
        run: |
          for f in financials.db portfolio.db parameters.json refdata_tables.json shares.csv; do
            if [ -f "$f" ]; then cp "$f" "data-branch/$f"; fi
          done
          cd data-branch
          git -c user.name="stock-screen-bot" -c user.email="actions@users.noreply.github.com" add -A
          git -c user.name="stock-screen-bot" -c user.email="actions@users.noreply.github.com" \
            commit -m "Pipeline state: $(date -u +%F)" || echo "nothing changed"
          git push origin data

      - name: Upload the public report
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: screen
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
